shellEmulator: true

trustPolicy: no-downgrade
packages:
  - .

catalog:
  "@comark/markdown-it": ^0.3.4
  "@fontsource-variable/eb-garamond": ^5.2.7
  "@fontsource/alegreya-sans": ^5.2.8
  "@fontsource/caveat": ^5.2.8
  "@fontsource/eb-garamond": ^5.2.7
  "@fontsource/ephesis": ^5.2.8
  "@fontsource/monaspace-argon": ^5.2.5
  "@fontsource/source-sans-pro": ^5.2.5
  "@fontsource/source-serif-pro": ^5.2.5
  "@types/plotly.js": ^3.0.10
  "@vitejs/plugin-vue": ^6.0.5
  "@vue/test-utils": ^2.4.6
  csv-parse: ^6.2.1
  happy-dom: ^20.8.9
  plotly.js-dist-min: ^3.4.0
  vitest: ^4.1.2
catalogs:
  # Iconify 图标集合
  dev:
    vite: ^7.3.2
  icons:
    "@iconify-json/carbon": ^1.2.18
    "@iconify-json/duo-icons": ^1.2.2
    "@iconify-json/openmoji": ^1.2.24
    "@iconify-json/ph": ^1.2.2
    "@iconify-json/simple-icons": ^1.2.68
    "@iconify-json/skill-icons": ^1.2.3
    "@iconify-json/solar": ^1.2.5
    "@iconify-json/twemoji": ^1.2.5

  # 代码质量工具
  lint:
    "@antfu/eslint-config": ^7.2.0
    # '@babel/eslint-parser': ^7.28.6
    eslint: ^9.39.2
    eslint-plugin-format: ^1.3.1

  # Markdown 插件生态
  markdown:
    markdown-it-anchor: ^9.2.0
    markdown-it-attrs: ^4.3.1
    markdown-it-footnote: ^4.0.0
    markdown-it-hashtag: ^0.4.0
    markdown-it-implicit-figures: ^0.12.0
    markdown-it-mark: ^4.0.0
    markdown-it-mathjax3: ^4.3.2
    markdown-it-mdc: ^0.2.8
    markdown-it-ruby: ^1.1.2

  # 核心运行时依赖
  runtime:
    "@vue/devtools-api": ^8.0.5
    markdown-it: ^14.1.0

    medium-zoom: ^1.1.0
    vue: ^3.5.27
    vue-i18n: ^11.2.8
  # Shiki 代码高亮
  shiki:
    "@shikijs/colorized-brackets": ^3.21.0
    "@shikijs/transformers": ^3.21.0
    "@shikijs/vitepress-twoslash": ^3.21.0

  # 构建工具
  tooling:
    cz-conventional-changelog: ^3.3.0

    yaml: ^2.8.2
  # 类型定义
  types:
    "@types/markdown-it": ^14.1.2
    "@types/markdown-it-attrs": ^4.1.3
    "@types/markdown-it-footnote": ^3.0.4

  # UnoCSS 原子化样式
  unocss:
    "@unocss/eslint-plugin": ^66.6.7
    "@unocss/extractor-mdc": ^66.6.7
    "@unocss/reset": ^66.6.7
    unocss: ^66.6.7
  # VitePress 构建系统
  vitepress:
    "@intlify/unplugin-vue-i18n": ^11.0.3

    vitepress: 2.0.0-alpha.17
  # VueUse 组合式工具库
  vueuse:
    "@vueuse/core": ^14.1.0
    "@vueuse/gesture": ^2.0.0
    "@vueuse/motion": ^3.0.3

ignoredBuiltDependencies:
  - .
  - "@parcel/watcher"
  - {}
  - dprint
onlyBuiltDependencies:
  - esbuild
  - vue-demi
