catalogMode: prefer
cleanupUnusedCatalogs: true

minimumReleaseAgeExcludePrune: true
shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

packages:
  - .
  - workers/froq-api

overrides:
  '@nuxt/vite-builder@4.6.1>cssnano': 8.0.10
  vite@*: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest@*: 5.0.5

onlyBuiltDependencies:
  - '@takumi-rs/core'
  - better-sqlite3
  - esbuild
  - sharp
  - simple-git-hooks
  - vue-demi
  - workerd

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  simple-git-hooks: true
  vue-demi: true
  workerd: true

catalog:
  '@oreo-design/doodle-icons': ^0.1.0
  smol-toml: ^1.8.0
  yaml: ^2.9.0
catalogs:
  build:
    '@nuxt/content': ^3.15.2
    better-sqlite3: ^12.4.1
    katex: ^0.16.47

    nuxt: ^4.6.1
    rehype-callouts: ^2.2.0
    rehype-katex: ^7.0.1
    remark-math: ^6.0.0
  fonts:
    '@fontsource-variable/eb-garamond': ^5.3.0
    '@fontsource-variable/instrument-sans': ^5.3.0

  runtime:
    '@vueuse/core': ^14.4.0

    roughjs: ^4.6.6
    vue: ^3.5.39
  styling:
    '@iconify-json/carbon': ^1.2.18
    '@iconify-json/duo-icons': ^1.2.2
    '@iconify-json/openmoji': ^1.2.24
    '@iconify-json/ph': ^1.2.2
    '@iconify-json/selfhst': ^1.2.15
    '@iconify-json/simple-icons': ^1.2.68
    '@iconify-json/skill-icons': ^1.2.3
    '@iconify-json/solar': ^1.2.5
    '@iconify-json/twemoji': ^1.2.5
    '@unocss/extractor-mdc': ^66.6.7
    '@unocss/nuxt': ^66.6.7
    unocss: ^66.6.7

  tooling:
    '@types/node': 26.6.2
    lint-staged: ^16.1.6
    nuxtseo-devtools-host: ^1
    simple-git-hooks: ^2.14.0
    vite-plus: 1.3.0
    vue-tsc: ^3.3.11

  workers:
    '@cloudflare/workers-types': ^4.20250810.0
    cf: 1.0.0-beta.12
    typescript: ^5.9.2
    wrangler: ^4.136.0
