catalogMode: prefer
cleanupUnusedCatalogs: true

minimumReleaseAgeExclude:
  - '@iconify-json/selfhst@1.2.15'
shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
packages:
  - .
  - workers/froq-api

catalogs:
  build:
    '@nuxt/content': ^3.15.2
    better-sqlite3: ^12.4.1
    nuxt: ^4.5.2
    rehype-callouts: ^2.2.0

  lint:
    '@antfu/eslint-config': ^7.2.0
    '@unocss/eslint-plugin': ^66.6.7
    eslint: ^9.39.2

  runtime:
    vue: ^3.5.39
    roughjs: ^4.6.6

  styling:
    '@iconify-json/carbon': ^1.2.18
    '@iconify-json/duo-icons': ^1.2.2
    '@iconify-json/openmoji': ^1.2.24
    '@iconify-json/ph': ^1.2.2
    '@iconify-json/selfhst': ^1.2.15
    '@iconify-json/simple-icons': ^1.2.68
    '@iconify-json/skill-icons': ^1.2.3
    '@iconify-json/solar': ^1.2.5
    '@iconify-json/twemoji': ^1.2.5
    '@unocss/extractor-mdc': ^66.6.7
    '@unocss/nuxt': ^66.6.7
    unocss: ^66.6.7

  workers:
    '@cloudflare/workers-types': ^4.20250810.0
    typescript: ^5.9.2
    wrangler: ^4.28.0
  fonts:
    '@fontsource-variable/eb-garamond': ^5.3.0
    '@fontsource-variable/instrument-sans': ^5.3.0

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true

catalog:
  smol-toml: ^1.8.0
  yaml: ^2.9.0
