- title: 克制
  description: 每天深度工作不超过 2 个时间块（各 1.5–2 小时），过载不会提升产出只会透支后续
  category: energy_management
- title: 容忍
  description: "当天精力明显不足时，允许只做'最低必要版本'（Q1 的核心交付物），其余任务可延后"
  category: energy_management
- title: 恢复
  description: 连续 3 天高强度工作后，必须安排 1 天低负荷日（只做维护型任务或完全休息）
  category: energy_management
- title: 调整
  description: '躁狂期信号出现时（睡眠需求骤减、思维加速、过度乐观），主动削减 50% 新增任务，只维护已有线程'
  category: energy_management

- title: 睡眠窗
  description: '固定睡眠窗口：00:30 前入睡，08:00 左右起床（允许 ±30 分钟波动）'
  category: sleep_rhythm
- title: 睡前冷却
  description: "睡前 1 小时进入'冷却期'：不查看未完成任务清单、不接触学术/开源相关争论或复杂决策"
  category: sleep_rhythm
- title: 超时纠偏
  description: '如果连续 2 天入睡时间超过 01:30，第三天必须强制提前（即使未完成当天任务）'
  category: sleep_rhythm
- title: 抑郁加眠
  description: 抑郁期睡眠需求增加时，允许弹性延长至 9 小时，不自责，只记录而不强制纠正
  category: sleep_rhythm

- title: 限流30
  description: 每天非工作信息流浏览总时长 ≤30 分钟，分 2–3 次消费，避免单次超过 15 分钟
  category: information_diet
- title: 夜间降噪
  description: '避免深夜（22:00 后）接触高刺激内容：争论、重度技术讨论、情绪性新闻或社交冲突'
  category: information_diet
- title: 抑郁避比
  description: "抑郁期减少'对比型'内容摄入（他人成果展示、效率炫耀、进度竞赛），优先消费'过程型'内容"
  category: information_diet
- title: 躁期减激
  description: "躁狂期减少'激发型'内容（新技术、新项目、宏大计划），避免冲动开启过多新线程"
  category: information_diet

- title: Q3定窗
  description: Q3（紧急但不重要）每天集中在 1 个 30 分钟时间块处理，不允许零散响应
  category: task_boundary
- title: 统一回复
  description: 对无关年度目标的临时请求，设定统一回复时间（如每天下午 4 点），不立即响应
  category: task_boundary
- title: 先问目的
  description: "新增任务必须先问'它服务今年哪个目标？'，无法对应则默认拒绝或延后到季度复盘时再议"
  category: task_boundary
- title: 周限Q2
  description: 单周新增任务不超过 3 个 Q2 级别项，超出部分自动进入 Backlog 而非当周计划
  category: task_boundary

- title: 能量标签
  description: 为每个 Q1/Q2 任务标注 @A（需高能量）或 @B（低能量可做），方便当天按状态选择
  category: state_adaptive
- title: 缓冲任务
  description: "准备 2–3 个'缓冲任务'：无截止日期、无复杂决策、做了有微小进展即可（如整理文献、补文档注释）"
  category: state_adaptive
- title: 削减暴露
  description: 情绪明显波动时（无论高或低），严格削减 Q3 和 Q4 暴露，减少外部刺激输入
  category: state_adaptive
- title: 最小模式
  description: "连续 3 天无法启动任何 Q2 任务时，触发'最小系统模式'：只保留 Q1 硬交付 + 睡眠 + 用药，其余全部暂停"
  category: state_adaptive

- title: 药复锁定
  description: "用药与复诊时间锁定在日历中，视为'不可协商事项'，优先级高于所有 Q1 任务"
  category: health_anchors
- title: 双晚休
  description: "每周至少安排 2 个'完全不安排工作'的晚上，允许无目的放空或低刺激活动"
  category: health_anchors
- title: 月度复盘
  description: "每月末做 1 次'状态-工作量'复盘：记录本月情绪波动、睡眠质量、任务完成率的关系，找规律"
  category: health_anchors
- title: 信号止损
  description: 当身体发出明确信号（持续疲惫、易怒、注意力涣散、睡眠紊乱）时，优先调整节奏而非硬撑
  category: health_anchors
