- title: 深工里程碑
  description: 每日预先设定 2–3 个可停止里程碑，抵达任一里程碑时必须评估是否继续。
  category: 专注边界

- title: 日终复盘
  description: 每天 23:00 前完成一次 10 分钟复盘，更新任务状态并记录当天违规情况。
  category: 专注边界

- title: 低能优先最低版本
  description: 当天精力明显不足时，只要求交付 Q1 的最低必要版本，其余任务允许顺延且不自责。
  category: 专注边界

- title: 信息限流
  description: 非工作信息总时长 ≤30 分钟/天，分 2–3 次，每次不超过 15 分钟。
  category: 信息饮食

- title: 夜间降噪
  description: 22:00 后避免高刺激输入，如争论、情绪新闻、重度技术探索和社交冲突。
  category: 信息饮食

- title: 情绪低落降对比
  description: 情绪低落或敏感时减少对比型内容，优先过程型内容。
  category: 信息饮食

- title: 兴奋期禁开新坑
  description: 明显兴奋或冲动时不接新项目、不立新目标、不开新 repo。
  category: 信息饮食

- title: Q3 时间盒
  description: Q3 事项每天只在一个固定 30 分钟时间盒内处理，其余时间不响应。
  category: 任务边界

- title: 统一回复时间
  description: 对不影响年度目标的临时请求，只在约定时间段统一回复。
  category: 任务边界

- title: 先绑定年度目标
  description: 新任务若无法绑定到年度目标，则进入 backlog 或直接拒绝。
  category: 任务边界

- title: 周度承诺上限
  description: 单周最多新增 3 个 Q2 承诺项，超出全部进入 backlog。
  category: 任务边界
