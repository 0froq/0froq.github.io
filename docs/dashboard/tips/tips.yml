- title: 强度后低负荷日
  description: 连续 3 天高强度输出后，第 4 天只安排低负荷任务或休息。
  category: 恢复机制

- title: 预警减载
  description: 一旦出现明显预警信号，立即减少 50% 新增承诺，只维护既有线程。
  category: 恢复机制

- title: 睡眠窗口
  description: 目标作息：00:30 前入睡，08:00 左右起床，允许 ±30 分钟浮动。
  category: 作息节律

- title: 睡前冷却
  description: 睡前 60 分钟不审判 todo、不做复杂决策、不参与争论。
  category: 作息节律

- title: 连续晚睡纠偏
  description: 若连续 2 天入睡晚于 01:30，第 3 天必须提前收工并强制提前入睡。
  category: 作息节律

- title: 睡眠弹性
  description: 需要更多睡眠的阶段允许睡到 9 小时，只记录不纠正。
  category: 作息节律

- title: 白痴任务池
  description: 为每周准备 2–3 个极低能量任务，状态差时优先执行。
  category: 执行策略

- title: 波动时减暴露
  description: 情绪明显波动时缩减 Q3/Q4 与外部输入，优先保护睡眠与节奏。
  category: 执行策略

- title: 分支两层限制
  description: 任务只允许两层深度，出现第三层时将中间层提升为独立任务，并将上层标记为 Blocked。
  category: 项目管理

- title: MVP 回主线
  description: Side task 一旦达到 MVP，须在 24 小时内回到被阻塞的主任务。
  category: 项目管理
