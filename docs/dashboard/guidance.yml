- title: 深工上限
  description: 每天深度工作最多 2 个时间块（各 90–120 分钟）；超过上限只会透支后续。
  category: 专注边界
  links:
    - label: 深度工作法则
      url: /blog/posts/deep-work-rules/
    - label: 能量管理四象限
      url: /blog/posts/energy-management-quadrants/

- title: 低能容忍
  description: 当天精力明显不足时，优先交付 Q1 的“最低必要版本”；其余任务允许顺延，不做道德化自责。
  category: 专注边界

- title: 强度后恢复
  description: 连续 3 天高强度输出后，必须安排 1 天低负荷日（维护型任务或完全休息）。
  category: 恢复机制

- title: 触发即减载
  description: 一旦出现明显预警信号（睡眠需求骤减、思维加速、过度乐观或冲动开新坑），立刻减少 50% 新增承诺，只维护既有线程。
  category: 恢复机制

- title: 睡眠窗口
  description: 尽量固定睡眠窗口：00:30 前入睡，08:00 左右起床（允许 ±30 分钟浮动）。
  category: 作息节律

- title: 睡前冷却
  description: 睡前 60 分钟进入冷却：不审判 todo、不做复杂决策、不参与争论；只做低刺激收尾。
  category: 作息节律

- title: 连续晚睡纠偏
  description: 若连续 2 天入睡晚于 01:30，第 3 天必须提前收工并强制提前入睡（即使任务未完）。
  category: 作息节律

- title: 睡眠弹性
  description: 需要更多睡眠的阶段允许延长至 9 小时；只记录，不强行纠正（先保底稳定）。
  category: 作息节律

- title: 信息限流
  description: 非工作信息流总时长 ≤30 分钟/天；分 2–3 次消化，单次不超过 15 分钟。
  category: 信息饮食

- title: 夜间降噪
  description: 22:00 后避免高刺激输入（争论、情绪性新闻、重度技术探索、社交冲突）。
  category: 信息饮食

- title: 减少对比输入
  description: 当情绪低落或敏感时，减少“对比型内容”（成果展示、效率竞赛）；优先看“过程型内容”（方法、复盘、教程）。
  category: 信息饮食

- title: 禁止开新坑
  description: 当明显兴奋或冲动时，减少“激发型内容”（新技术、新项目、宏大计划）；不立项、不许愿、不开新 repo。
  category: 信息饮食

- title: Q3 固定时间盒
  description: Q3 事项每天只在一个固定时间盒内处理（建议 30 分钟）；其余时间不零散响应。
  category: 任务边界

- title: 统一回复窗口
  description: 对不影响年度目标的临时请求，设置统一回复时间（例如 16:00），不即时响应。
  category: 任务边界

- title: 先绑定目标
  description: 新增任务先回答“它服务今年哪个目标？”无法绑定则进入 backlog 或直接拒绝。
  category: 任务边界

- title: 周度承诺上限
  description: 单周最多新增 3 个 Q2 承诺项；超出全部进入 backlog（不进入本周四象限）。
  category: 任务边界

- title: 能量标签
  description: 每个 Q1/Q2 任务标注 @A（高能）或 @B（低能可做），当天按状态选任务，不强行硬顶。
  category: 执行策略

- title: 缓冲任务池
  description: 常备 2–3 个缓冲任务（低决策、低阻力、做了就算进展），用于状态不佳时维持惯性。
  category: 执行策略

- title: 波动降暴露
  description: 情绪明显波动时，优先减少输入与干扰：缩减 Q3/Q4 暴露，保护睡眠与节奏。
  category: 执行策略

- title: 最小系统模式
  description: 若连续 3 天无法启动任何 Q2：进入最小模式——只保留 Q1 核心交付 + 睡眠 + 用药/复诊，其余暂停。
  category: 恢复机制

- title: 医疗锁定
  description: 用药与复诊在日历中锁定为不可协商事项；优先级高于任何 Q1 交付。
  category: 作息节律

- title: 每周双晚休
  description: 每周至少 2 个晚上完全不安排工作，用于放空与低刺激恢复。
  category: 恢复机制

- title: 月度复盘
  description: 每月末做一次“状态—睡眠—工作量”复盘：记录波动与触发源，调整下月护栏。
  category: 恢复机制

- title: 身体信号止损
  description: 出现持续疲惫、易怒、注意力涣散或睡眠紊乱等信号时，先减载与调整节奏，再谈效率。
  category: 恢复机制
