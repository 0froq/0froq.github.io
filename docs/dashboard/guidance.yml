- title: 深工里程碑
  description: 每日预先设定 2–3 个可停止里程碑，抵达任一里程碑时必须评估是否继续。
  category: 专注边界

- title: 日终复盘
  description: 每天 23:00 前完成一次 10 分钟复盘，更新任务状态并记录当天违规情况。
  category: 专注边界

- title: 低能优先最低版本
  description: 当天精力明显不足时，只要求交付 Q1 的最低必要版本，其余任务允许顺延且不自责。
  category: 专注边界

- title: 强度后低负荷日
  description: 连续 3 天高强度输出后，第 4 天只安排低负荷任务或休息。
  category: 恢复机制

- title: 预警减载
  description: 一旦出现明显预警信号，立即减少 50% 新增承诺，只维护既有线程。
  category: 恢复机制

- title: 睡眠窗口
  description: 目标作息：00:30 前入睡，08:00 左右起床，允许 ±30 分钟浮动。
  category: 作息节律

- title: 睡前冷却
  description: 睡前 60 分钟不审判 todo、不做复杂决策、不参与争论。
  category: 作息节律

- title: 连续晚睡纠偏
  description: 若连续 2 天入睡晚于 01:30，第 3 天必须提前收工并强制提前入睡。
  category: 作息节律

- title: 睡眠弹性
  description: 需要更多睡眠的阶段允许睡到 9 小时，只记录不纠正。
  category: 作息节律

- title: 信息限流
  description: 非工作信息总时长 ≤30 分钟/天，分 2–3 次，每次不超过 15 分钟。
  category: 信息饮食

- title: 夜间降噪
  description: 22:00 后避免高刺激输入，如争论、情绪新闻、重度技术探索和社交冲突。
  category: 信息饮食

- title: 情绪低落降对比
  description: 情绪低落或敏感时减少对比型内容，优先过程型内容。
  category: 信息饮食

- title: 兴奋期禁开新坑
  description: 明显兴奋或冲动时不接新项目、不立新目标、不开新 repo。
  category: 信息饮食

- title: Q3 时间盒
  description: Q3 事项每天只在一个固定 30 分钟时间盒内处理，其余时间不响应。
  category: 任务边界

- title: 统一回复时间
  description: 对不影响年度目标的临时请求，只在约定时间段统一回复。
  category: 任务边界

- title: 先绑定年度目标
  description: 新任务若无法绑定到年度目标，则进入 backlog 或直接拒绝。
  category: 任务边界

- title: 周度承诺上限
  description: 单周最多新增 3 个 Q2 承诺项，超出全部进入 backlog。
  category: 任务边界

- title: 白痴任务池
  description: 为每周准备 2–3 个极低能量任务，状态差时优先执行。
  category: 执行策略

- title: 波动时减暴露
  description: 情绪明显波动时缩减 Q3/Q4 与外部输入，优先保护睡眠与节奏。
  category: 执行策略

- title: 分支两层限制
  description: 任务只允许两层深度，出现第三层时将中间层提升为独立任务，并将上层标记为 Blocked。
  category: 项目管理

- title: MVP 回主线
  description: Side task 一旦达到 MVP，须在 24 小时内回到被阻塞的主任务。
  category: 项目管理
