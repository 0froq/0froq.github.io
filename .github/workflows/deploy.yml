# Deploy Nuxt site to Cloudflare Pages (direct upload via Wrangler).
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN   — Account Cloudflare Pages Edit (+ Account Read)
#   CLOUDFLARE_ACCOUNT_ID  — see `wrangler whoami`
#
# Project: `froq` → https://froq.pages.dev

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate
        run: pnpm generate

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          workingDirectory: workers/froq-api
          packageManager: pnpm
          command: pages deploy ../../.output/public --project-name=froq --branch=main --commit-dirty=true

      - name: Deployment URL
        run: |
          echo "url: ${{ steps.deploy.outputs.deployment-url }}"
          echo "alias: ${{ steps.deploy.outputs.pages-deployment-alias-url }}"
