# Deploy Nuxt site to Cloudflare Pages (direct upload via Wrangler).
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN   — Account Cloudflare Pages Edit (+ Account Read)
#   CLOUDFLARE_ACCOUNT_ID  — see `wrangler whoami`
#   NUXT_PUBLIC_FROQ_API   — optional; defaults to https://api.froq.me
#
# Project: `froq` → https://froq.pages.dev
# Custom domain: Dashboard → Pages → froq → Custom domains → froq.me
#
# `main` deploys the production branch. Pull requests deploy a preview
# branch (not production) so the PR can be clicked before merge.
#
# Create token: https://dash.cloudflare.com/profile/api-tokens
#   (Workers template + Cloudflare Pages:Edit is enough)

name: Deploy Nuxt to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate Nuxt site
        env:
          NUXT_PUBLIC_FROQ_API: ${{ secrets.NUXT_PUBLIC_FROQ_API }}
        run: pnpm generate

      - name: Resolve Pages branch
        id: pages
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "branch=${GITHUB_HEAD_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      # Use workspace wrangler (workers/froq-api) so the action does not
      # `pnpm add wrangler` under pnpm 11 (ERR_PNPM_IGNORED_BUILDS).
      # Preview PRs must not pass --branch=main (that is production).
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          workingDirectory: workers/froq-api
          packageManager: pnpm
          command: pages deploy ../../.output/public --project-name=froq --branch=${{ steps.pages.outputs.branch }} --commit-dirty=true

      - name: Deployment URL
        run: |
          echo "url: ${{ steps.deploy.outputs.deployment-url }}"
          echo "alias: ${{ steps.deploy.outputs.pages-deployment-alias-url }}"
          {
            echo "### Cloudflare Pages"
            echo "- url: ${{ steps.deploy.outputs.deployment-url }}"
            echo "- alias: ${{ steps.deploy.outputs.pages-deployment-alias-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
