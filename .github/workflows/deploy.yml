# Deploy VitePress site to Cloudflare Pages (direct upload via Wrangler).
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN   — Account Cloudflare Pages Edit (+ Account Read)
#   CLOUDFLARE_ACCOUNT_ID  — see `wrangler whoami` (Sayhola account)
#   VITE_GITHUB_CLIENT_ID
#   VITE_GITHUB_READ_TOKEN
#   VITE_GITHUB_AUTH_PROXY — e.g. https://froq-api.sayhola.workers.dev
#   VITE_FROQ_API          — optional; defaults to AUTH_PROXY
#
# Project: `froq` → https://froq.pages.dev
# Custom domain: Dashboard → Pages → froq → Custom domains → froq.me
#
# Create token: https://dash.cloudflare.com/profile/api-tokens
#   (Workers template + Cloudflare Pages:Edit is enough)

name: Deploy VitePress to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build with VitePress
        env:
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_GITHUB_READ_TOKEN: ${{ secrets.VITE_GITHUB_READ_TOKEN }}
          VITE_GITHUB_AUTH_PROXY: ${{ secrets.VITE_GITHUB_AUTH_PROXY }}
          VITE_FROQ_API: ${{ secrets.VITE_FROQ_API }}
        run: pnpm docs:build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy docs/.vitepress/dist --project-name=froq --branch=main --commit-dirty=true

      - name: Deployment URL
        run: |
          echo "url: ${{ steps.deploy.outputs.deployment-url }}"
          echo "alias: ${{ steps.deploy.outputs.pages-deployment-alias-url }}"
