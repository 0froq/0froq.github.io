name: write-lockfile
on:
  push:
    branches:
      - cursor/og-v0.2.0-froq-me-695f
    paths:
      - .github/workflows/write-lockfile.yml
permissions:
  contents: write
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/og-v0.2.0-froq-me-695f
          fetch-depth: 1
      - name: replace lockfile
        run: |
          set -euo pipefail
          curl -fsSL -o pnpm-lock.yaml "https://raw.githubusercontent.com/0froq/og-layer/cursor/lockfile-blob-fbf1/pnpm-lock.yaml"
          python3 - << 'PY'
          import hashlib, pathlib
          data = pathlib.Path("pnpm-lock.yaml").read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          expected = "077083d21c9540e6bb29ffb9a2459fa9f21b0a37c679c31c6d4e7a6b09f04e74"
          if digest != expected or len(data) != 631216:
              raise SystemExit(f"lockfile mismatch {digest} {len(data)}")
          PY
          rm -f cursor-lockfile-probe.txt
          rm -f .github/workflows/write-lockfile.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "froQ"
          git config user.email "sayhola@froq.me"
          git add -A -- pnpm-lock.yaml cursor-lockfile-probe.txt .github/workflows/write-lockfile.yml
          git commit -m "feat: draw page descriptions on og-layer v0.2.0 cards"
          git push origin HEAD:cursor/og-v0.2.0-froq-me-695f
